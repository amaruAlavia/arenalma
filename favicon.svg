<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Paleta Trabaja Tu Luz: Rosa Cuarzo, Aqua Celestial y Oro Sagrado -->
    <radialGradient id="portal-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FAF6F8"/>
      <stop offset="40%" stop-color="#F4CAD6"/>
      <stop offset="75%" stop-color="#9BC6D0"/>
      <stop offset="100%" stop-color="#4D3D69"/>
    </radialGradient>
    <linearGradient id="gold-sacred" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E2B8"/>
      <stop offset="50%" stop-color="#C59F60"/>
      <stop offset="100%" stop-color="#997537"/>
    </linearGradient>
    <linearGradient id="aqua-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A3B5"/>
      <stop offset="50%" stop-color="#A89AC3"/>
      <stop offset="100%" stop-color="#6AA5B2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo cósmico violeta/portal místico -->
  <circle cx="50" cy="50" r="48" fill="#1F172B" />
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#aqua-rose)" stroke-width="0.8" opacity="0.8" />
  
  <!-- Mandala exterior con destellos de pétalos y luz celestial -->
  <g stroke="url(#gold-sacred)" stroke-width="0.8" fill="url(#portal-glow)" filter="url(#glow)">
    <g id="petal">
      <path d="M50 7 C47 16 43 23 50 30 C57 23 53 16 50 7 Z" />
      <circle cx="50" cy="12" r="1.1" fill="#FFFFFF" />
    </g>
    <use href="#petal" transform="rotate(22.5 50 50)" />
    <use href="#petal" transform="rotate(45 50 50)" />
    <use href="#petal" transform="rotate(67.5 50 50)" />
    <use href="#petal" transform="rotate(90 50 50)" />
    <use href="#petal" transform="rotate(112.5 50 50)" />
    <use href="#petal" transform="rotate(135 50 50)" />
    <use href="#petal" transform="rotate(157.5 50 50)" />
    <use href="#petal" transform="rotate(180 50 50)" />
    <use href="#petal" transform="rotate(202.5 50 50)" />
    <use href="#petal" transform="rotate(225 50 50)" />
    <use href="#petal" transform="rotate(247.5 50 50)" />
    <use href="#petal" transform="rotate(270 50 50)" />
    <use href="#petal" transform="rotate(292.5 50 50)" />
    <use href="#petal" transform="rotate(315 50 50)" />
    <use href="#petal" transform="rotate(337.5 50 50)" />
  </g>

  <!-- Anillos concéntricos de oro y turquesa -->
  <circle cx="50" cy="50" r="28" fill="#2A1E35" stroke="url(#gold-sacred)" stroke-width="1.8" />
  <circle cx="50" cy="50" r="25.5" fill="none" stroke="#6AA5B2" stroke-width="0.9" stroke-dasharray="2 1.5" />
  <circle cx="50" cy="50" r="23" fill="none" stroke="url(#gold-sacred)" stroke-width="0.6" />

  <!-- Triángulo Sagrado de "Trabaja Tu Luz" en el centro -->
  <polygon points="50,33 60,49 40,49" fill="none" stroke="url(#gold-sacred)" stroke-width="1.2" opacity="0.9" />

  <!-- Monograma estilizado de Arenalma -->
  <text x="50" y="62" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="16" font-weight="600" font-style="italic" fill="url(#gold-sacred)" text-anchor="middle" letter-spacing="0.5">A</text>
  
  <!-- Destellos estelares tipo oráculo -->
  <circle cx="50" cy="27" r="1.1" fill="#FFFFFF" />
  <circle cx="50" cy="73" r="1.1" fill="#FFFFFF" />
  <circle cx="27" cy="50" r="1.1" fill="#6AA5B2" />
  <circle cx="73" cy="50" r="1.1" fill="#F4CAD6" />
</svg>
